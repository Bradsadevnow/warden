<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Warden</title>
<style>
  :root {
    --bg: #070b14; --panel: rgba(14, 20, 36, .78); --line: rgba(120, 150, 210, .2);
    --text: #e6ecf8; --mute: #8d9bb8; --cyan: #39c5ff; --amber: #ffb020;
    --green: #3ddc84; --red: #ff5468;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  body { min-height: 100vh; background:
    radial-gradient(900px 500px at 12% -10%, rgba(57,197,255,.10), transparent 60%),
    radial-gradient(700px 500px at 100% 0%, rgba(150,90,255,.08), transparent 60%), var(--bg); }
  .wrap { max-width: 860px; margin: 0 auto; padding: 0 18px 60px; }
  header { display: flex; align-items: center; gap: 12px; padding: 18px 0 10px; flex-wrap: wrap; }
  header h1 { margin: 0; font-size: 13px; letter-spacing: .26em; text-transform: uppercase; color: var(--mute); font-weight: 600; }
  header h1 b { color: var(--cyan); }
  header .sp { flex: 1; }
  a { color: var(--cyan); text-decoration: none; cursor: pointer; } a:hover { text-decoration: underline; }
  .chip { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 12.5px; border: 1px solid var(--line); color: var(--mute); white-space: nowrap; }
  .chip.ok { color: var(--green); border-color: rgba(61,220,132,.45); }
  .chip.warn { color: var(--amber); border-color: rgba(255,176,32,.45); }
  .chip.bad { color: var(--red); border-color: rgba(255,84,104,.5); }
  .live::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--green); margin-right: 7px; box-shadow: 0 0 8px var(--green); }
  .live.off::before { background: var(--red); box-shadow: 0 0 8px var(--red); }

  nav { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 20px; overflow-x: auto; }
  nav button { font: inherit; color: var(--mute); background: none; border: 0; border-bottom: 2px solid transparent; padding: 10px 14px; cursor: pointer; white-space: nowrap; }
  nav button[aria-selected="true"] { color: var(--text); border-bottom-color: var(--cyan); }
  nav button:focus-visible { outline: 2px solid var(--cyan); outline-offset: -2px; border-radius: 6px; }
  nav .dot { display: inline-block; min-width: 18px; padding: 0 5px; margin-left: 6px; border-radius: 9px; background: var(--amber); color: #1a1200; font-size: 12px; font-weight: 700; text-align: center; }

  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 18px; margin-bottom: 16px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
  .panel h2 { margin: 0 0 12px; font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: var(--mute); font-weight: 600; }
  .mute { color: var(--mute); }
  .empty { color: var(--mute); text-align: center; padding: 14px 8px; }
  .back { display: inline-block; margin-bottom: 12px; font-size: 14px; }

  /* agent list */
  .agent { display: block; color: inherit; text-decoration: none; border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; margin-bottom: 12px; background: var(--panel); }
  .agent:hover { border-color: rgba(57,197,255,.5); text-decoration: none; }
  .agent .row { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .agent .nm { font-size: 17px; font-weight: 650; }
  .agent .job { color: var(--mute); margin: 2px 0 10px; }
  .agent .meta { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .agent .sp { flex: 1; }

  /* agent page */
  .title { font-size: 24px; font-weight: 650; margin: 0 0 4px; }
  .perm { display: grid; grid-template-columns: 130px 1fr; gap: 6px 14px; padding: 10px 0; border-top: 1px solid var(--line); align-items: baseline; }
  .perm:first-of-type { border-top: 0; }
  .perm .a { font-weight: 600; }
  .perm .n { grid-column: 2; color: var(--mute); font-size: 13.5px; }
  .perm .lv { grid-column: 1; grid-row: 1; justify-self: start; }
  .perm .a { grid-column: 2; grid-row: 1; }
  .perm { grid-template-columns: 118px 1fr; }

  .item { border-top: 1px solid var(--line); padding: 12px 0; }
  .item:first-child { border-top: 0; }
  .hold { border: 1px solid rgba(255,176,32,.4); border-radius: 12px; padding: 14px 16px; margin-bottom: 12px; background: rgba(255,176,32,.05); }
  .hold:last-child { margin-bottom: 0; } .hold .big { font-size: 17px; font-weight: 650; }
  .btn { display: inline-block; margin-top: 10px; padding: 8px 16px; border-radius: 10px; border: 1px solid rgba(255,176,32,.6); color: var(--text); background: rgba(255,176,32,.12); }
  .btn:hover { background: rgba(255,176,32,.2); text-decoration: none; }

  .feed { list-style: none; margin: 0; padding: 0; }
  .feed li { border-top: 1px solid var(--line); padding: 11px 2px; }
  .feed li:first-child { border-top: 0; }
  .feed .top { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
  .feed .t { color: var(--mute); font-size: 12.5px; font-variant-numeric: tabular-nums; min-width: 58px; }
  .feed .what { flex: 1; min-width: 180px; overflow-wrap: anywhere; }
  .feed .what b { font-weight: 650; }
  .feed .sub { color: var(--mute); font-size: 13.5px; margin-top: 2px; padding-left: 68px; }
  .feed li.fresh { animation: flash 1.6s ease-out; }
  @keyframes flash { from { background: rgba(57,197,255,.16); } to { background: transparent; } }
  details summary { cursor: pointer; color: var(--mute); font-size: 12.5px; padding: 4px 0 0 68px; }
  pre { margin: 6px 0 0 68px; padding: 10px; background: rgba(0,0,0,.35); border-radius: 10px; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 12px; color: #b8c6e6; }
  .filters { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .filters button { font: inherit; font-size: 13.5px; color: var(--mute); background: none; border: 1px solid var(--line); border-radius: 999px; padding: 3px 14px; cursor: pointer; }
  .filters button[aria-pressed="true"] { color: var(--text); border-color: var(--cyan); }
  @media (max-width: 560px) { .feed .sub, details summary, pre { padding-left: 0; margin-left: 0; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1><b>Warden</b></h1>
  <span class="chip live" id="live">connecting</span>
  <span class="sp"></span>
  <a class="chip warn" id="doorChip" href="#activity" hidden></a>
  <span class="chip" id="audit">checking records</span>
</header>

<nav role="tablist" aria-label="Sections">
  <button role="tab" id="tab-agents" data-view="agents" aria-selected="true">Agents</button>
  <button role="tab" id="tab-inbox" data-view="inbox" aria-selected="false">Waiting for you<span class="dot" id="dot" hidden></span></button>
  <button role="tab" id="tab-activity" data-view="activity" aria-selected="false">Activity</button>
</nav>

<section id="view-agents"><div id="agentList"></div></section>

<section id="view-agent" hidden>
  <a class="back" href="#agents">&larr; All agents</a>
  <div class="panel">
    <div class="title" id="aName"></div>
    <div class="mute" id="aJob"></div>
    <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap" id="aMeta"></div>
  </div>
  <div class="panel"><h2>What it is allowed to do</h2><div id="aPerms"></div></div>
  <div class="panel" id="aDoorPanel" hidden><h2>Turned away at the door</h2><ul class="feed" id="aDoor"></ul></div>
  <div class="panel" id="aWaitPanel" hidden><h2>Waiting for a person</h2><div id="aWait"></div></div>
  <div class="panel"><h2>What it has done</h2><ul class="feed" id="aFeed"></ul><div class="empty" id="aEmpty">Nothing yet.</div></div>
</section>

<section id="view-inbox" hidden>
  <div class="panel">
    <div id="inbox"></div>
    <div class="empty" id="inboxEmpty">Nothing is waiting for you.</div>
  </div>
</section>

<section id="view-activity" hidden>
  <div class="panel">
    <div class="filters" id="filters">
      <button data-f="ALL" aria-pressed="true">Everything</button>
      <button data-f="ACCEPT" aria-pressed="false">Allowed</button>
      <button data-f="HOLD" aria-pressed="false">Needed approval</button>
      <button data-f="DENY" aria-pressed="false">Not allowed</button>
      <button data-f="DOOR" aria-pressed="false">Turned away</button>
    </div>
    <ul class="feed" id="feed"></ul>
    <div class="empty" id="feedEmpty">Nothing to show.</div>
  </div>
</section>
</div>

<script>
"use strict";
// Everything renders with textContent. Reasons and rationales are agent output; they are data.
const $ = (s) => document.querySelector(s);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };

const WORD = { ACCEPT: "Allowed", HOLD: "Needs approval", DENY: "Not allowed" };
const CHIP = { ACCEPT: "ok", HOLD: "warn", DENY: "bad" };
const LEVEL = { yes: ["Yes", "ok"], ask: ["Ask a person", "warn"], no: ["No", "bad"] };
// Why a request was stopped, in one plain line, by where it stopped.
const PLAIN = {
  schema: "The request wasn't written in a form the system accepts.",
  rationale: "The agent didn't give a reason.",
  what: "It tried to reach something it isn't allowed to touch.",
  "verb-auth": "That kind of action isn't allowed.",
  args: "A detail in the request was outside the allowed limits.",
  bind: "The request didn't match what it said it was doing.",
  policy: "This agent isn't allowed to do that.",
  precondition: "A step that has to happen first hadn't happened.",
  hold: "Too many approvals were already waiting.",
  authz: "The approval didn't check out.",
  execute: "It would have broken a safety limit, so nothing changed.",
  footprint: "It would have changed something it shouldn't, so nothing changed.",
  invariant: "It would have broken a safety limit, so nothing changed.",
};

const money = (c) => "$" + (Number(c) / 100).toFixed(2);
const fmtT = (ts) => new Date(ts * 1000).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
function ago(ts, now) {
  const s = Math.max(0, Math.round(now - ts));
  if (s < 60) return "just now"; if (s < 3600) return Math.floor(s / 60) + " min ago";
  if (s < 86400) return Math.floor(s / 3600) + " hr ago"; return Math.floor(s / 86400) + " days ago";
}
let S = null, A = null;   // latest /state and /approval/state
const nameOf = (id) => (S && S.names[id]) || id || "Someone";

const NOM = /^NOMINATE\s+what=(\S+)\s+verb=(\w+)\s+args=(.*)$/;
function nominationOf(r) {
  let verb, what, args = {};
  if (r.claim) { verb = r.claim.verb; what = r.claim.what; args = r.claim.args; }
  else for (const l of (r.rationale || "").split("\n")) {
    const m = NOM.exec(l.trim());
    if (m) { verb = m[2]; what = m[1]; for (const p of m[3].split(";")) { const i = p.indexOf(":"); if (i > 0) args[p.slice(0, i).trim()] = p.slice(i + 1).trim(); } break; }
  }
  return verb ? { verb, what, args } : null;
}
// What was asked, as a short phrase. Known actions read naturally; others fall back to the declared label.
function phrase(n) {
  if (!n) return "did something that wasn't a request";
  const a = n.args, id = a.order_id || n.what;
  switch (n.verb) {
    case "issue_refund": return `refund ${/^\d+$/.test(String(a.amount_cents || "")) ? money(a.amount_cents) : "an amount"} on order ${id}`;
    case "lookup_order": return `look up order ${id}`;
    case "add_note": return `add a note to order ${id}`;
    case "send_message": return `email the customer about order ${id}`;
    case "cancel_order": return `cancel order ${id}`;
    default: return n.verb.replace(/_/g, " ") + " (" + n.what + ")";
  }
}
function stopOf(r) { const l = r.decision_basis[r.decision_basis.length - 1]; return { stage: l[0], why: String(l[2]) }; }
function reason(r) {
  if (r.decision === "HOLD") return "Waiting for a person to approve.";
  return PLAIN[stopOf(r).stage] || "It didn't pass a safety check.";
}

function row(r, fresh, showAgent) {
  const li = el("li", fresh ? "fresh" : ""), n = nominationOf(r), top = el("div", "top");
  const what = el("span", "what");
  if (showAgent) what.append(el("b", null, nameOf(r.principal)), " wanted to " + phrase(n));
  else what.append(phrase(n).replace(/^./, (c) => c.toUpperCase()));
  top.append(el("span", "t", fmtT(r.ts)), what, el("span", "chip " + CHIP[r.decision], WORD[r.decision]));
  li.append(top);
  if (r.decision !== "ACCEPT") li.append(el("div", "sub", reason(r)));
  const d = el("details"); d.append(el("summary", null, "Technical detail"));
  d.append(el("pre", null, "THE AGENT'S OWN WORDS (recorded as written)\n" + r.rationale + "\n\nCHECKS\n" +
    r.decision_basis.map((c) => `${c[1].padEnd(6)} ${c[0].padEnd(13)} ${String(c[2]).slice(0, 200)}`).join("\n") + "\n\nreceipt " + r.id));
  li.append(d);
  return li;
}

// Requests turned away before the gate: nobody proved who they were, so nothing was decided.
function doorText(e) {
  const who = e.claimed ? (S.names[e.claimed] || `"${e.claimed}"`) : "Someone";
  switch (e.code) {
    case "bad_signature": return `${who === "Someone" ? "Someone" : "Someone claiming to be " + who} couldn't prove who they were.`;
    case "replay": return `A request from ${who} was sent a second time and refused.`;
    case "stale": return `A request claiming to be ${who} was too old, or dated in the future.`;
    case "unknown_agent": return `Someone claimed to be an agent that isn't registered${e.claimed ? ` (${who})` : ""}.`;
    case "login_failed": return "A sign-in attempt didn't pass the identity check.";
    case "no_session": return e.kind === "approve" ? "Someone tried to approve an action without signing in." : "Someone tried to set up a device without signing in.";
    case "approval_refused": return `${who === "Someone" ? "A" : who + "'s"} approval was refused.`;
    case "enroll_refused": return "A device set-up was refused.";
    case "local_only": return "Someone on the network tried to use a control that only works on the Warden machine.";
    default: return "A badly formed request was refused.";
  }
}
function doorRow(e) {
  const li = el("li"), top = el("div", "top");
  top.append(el("span", "t", fmtT(e.ts)), el("span", "what", doorText(e)), el("span", "chip bad", "Turned away"));
  li.append(top, el("div", "sub", "From " + e.ip + ". Nothing was decided, because they never proved who they were."));
  const d = el("details"); d.append(el("summary", null, "Technical detail"));
  d.append(el("pre", null, `door: ${e.kind}\ncode: ${e.code}\nreason: ${e.reason}\nclaimed: ${e.claimed}\nfrom: ${e.ip}`)); li.append(d);
  return li;
}
const doorFor = (id, secs) => S.door.recent.filter((e) => e.claimed === id && e.ts > S.now - secs);

function holdCard(p, withAgent) {
  const c = {}; for (const l of p.canonical.split("\n")) { const i = l.indexOf(":"); if (i > 0) c[l.slice(0, i)] = l.slice(i + 1); }
  const n = { verb: c.verb, what: c.what, args: {} };
  try { for (const [k, v] of Object.entries(JSON.parse(c.args || "{}"))) n.args[k] = String(v); } catch (e) {}
  const h = el("div", "hold"), left = Math.max(0, Math.round(p.expires - A.now));
  h.append(el("div", "big", `${nameOf(c.principal)} wants to ${phrase(n)}`),
           el("div", "mute", `${p.approvers.map(nameOf).join(" or ")} needs to approve this. ${left} seconds left.`));
  const b = el("a", "btn", "Review and approve"); b.href = "/approve"; h.append(b);
  return h;
}

// ---- views ------------------------------------------------------------------
function status(a) {
  const mine = A.pending.filter((p) => p.principal_id === a.id).length;
  const recent = S.receipts.filter((r) => r.principal === a.id && r.decision === "DENY" && r.ts > S.now - 60).length;
  const knocks = doorFor(a.id, 3600).length;
  if (knocks) return [`Someone tried to act as this agent ${knocks} time${knocks > 1 ? "s" : ""} and was turned away`, "warn"];
  if (mine) return ["Waiting for a person", "warn"];
  if (recent >= 5) return [`Refused ${recent} times in the last minute. Worth a look.`, "warn"];
  return ["Working normally", "ok"];
}
function renderAgents() {
  const box = $("#agentList"); box.replaceChildren();
  for (const a of S.agents) {
    const c = S.by_principal[a.id] || { ACCEPT: 0, DENY: 0, HOLD: 0, last_ts: null };
    const card = el("a", "agent"); card.href = "#agent/" + a.id;
    const row1 = el("div", "row"); const [st, cls] = status(a);
    row1.append(el("span", "nm", a.name), el("span", "chip " + cls, st));
    card.append(row1, el("div", "job", a.job));
    const meta = el("div", "meta");
    meta.append(el("span", "chip", a.domain), el("span", "chip", "Owner: " + (a.owner_name || "nobody")),
                el("span", "chip " + (a.authenticated ? "ok" : "bad"), a.authenticated ? "Verified" : "Not verified"),
                el("span", "sp"),
                el("span", "mute", c.last_ts ? "Last active " + ago(c.last_ts, S.now) : "No activity yet"));
    card.append(meta); box.append(card);
  }
}
function renderAgent(id) {
  const a = S.agents.find((x) => x.id === id);
  if (!a) { location.hash = "#agents"; return; }
  $("#aName").textContent = a.name; $("#aJob").textContent = a.job;
  const meta = $("#aMeta"); meta.replaceChildren(el("span", "chip", a.domain), el("span", "chip", "Owner: " + (a.owner_name || "nobody")),
    el("span", "chip " + (a.authenticated ? "ok" : "bad"), a.authenticated ? "Verified" : "Not verified"));
  const perms = $("#aPerms"); perms.replaceChildren();
  for (const p of a.permissions) {
    const row = el("div", "perm"), [w, cls] = LEVEL[p.level];
    row.append(el("span", "chip " + cls + " lv", w), el("span", "a", p.action));
    if (p.note) row.append(el("span", "n", p.note));
    perms.append(row);
  }
  const knocks = doorFor(id, 86400).reverse();
  $("#aDoorPanel").hidden = knocks.length === 0;
  $("#aDoor").replaceChildren(...knocks.map(doorRow));
  const mine = A.pending.filter((p) => p.principal_id === id);
  $("#aWaitPanel").hidden = mine.length === 0;
  const w = $("#aWait"); w.replaceChildren(...mine.map((p) => holdCard(p)));
  const rs = S.receipts.filter((r) => r.principal === id).reverse();
  $("#aEmpty").hidden = rs.length > 0;
  $("#aFeed").replaceChildren(...rs.map((r) => row(r, fresh.has(r.id), false)));
}
function renderInbox() {
  const box = $("#inbox"); box.replaceChildren(...A.pending.map((p) => holdCard(p, true)));
  $("#inboxEmpty").hidden = A.pending.length > 0;
  const d = $("#dot"); d.hidden = A.pending.length === 0; d.textContent = A.pending.length;
}
let filter = "ALL";
function renderActivity() {
  if (filter === "DOOR") {
    const ds = S.door.recent.slice().reverse();
    $("#feedEmpty").hidden = ds.length > 0; $("#feedEmpty").textContent = "Nobody has been turned away.";
    $("#feed").replaceChildren(...ds.map(doorRow)); return;
  }
  $("#feedEmpty").textContent = "Nothing to show.";
  const rs = S.receipts.slice().reverse().filter((r) => filter === "ALL" || r.decision === filter);
  $("#feedEmpty").hidden = rs.length > 0;
  $("#feed").replaceChildren(...rs.map((r) => row(r, fresh.has(r.id), true)));
}
function renderAudit() {
  const hour = S.door.recent.filter((e) => e.ts > S.now - 3600).length, dc = $("#doorChip");
  dc.hidden = hour === 0; dc.textContent = `${hour} turned away in the last hour`;
  const bad = S.violations.length > 0, c = $("#audit");
  c.className = "chip " + (bad ? "bad" : "ok");
  c.textContent = bad ? "Records don't add up" : "Records verified";
  c.title = bad ? S.violations.join("\n") : "Every action on record was re-checked independently and the records match what happened.";
}

// ---- routing ----------------------------------------------------------------
let route = ["agents"];
function go() {
  const h = location.hash.slice(1).split("/");
  route = ["agents", "agent", "inbox", "activity"].includes(h[0]) ? h : ["agents"];
  const top = route[0] === "agent" ? "agents" : route[0];
  for (const v of ["agents", "agent", "inbox", "activity"]) $("#view-" + v).hidden = v !== route[0];
  for (const v of ["agents", "inbox", "activity"]) $("#tab-" + v).setAttribute("aria-selected", v === top);
  if (S) render();
}
document.querySelectorAll("nav button").forEach((b) => b.addEventListener("click", () => { location.hash = "#" + b.dataset.view; }));
$("#doorChip").addEventListener("click", () => { setFilter("DOOR"); });
window.addEventListener("hashchange", go);
function setFilter(f) {
  filter = f;
  document.querySelectorAll("#filters button").forEach((x) => x.setAttribute("aria-pressed", x.dataset.f === f));
  if (S) renderActivity();
}
$("#filters").addEventListener("click", (e) => { const b = e.target.closest("button"); if (b) setFilter(b.dataset.f); });
function render() {
  renderAudit(); renderInbox();
  if (route[0] === "agents") renderAgents();
  else if (route[0] === "agent") renderAgent(route[1]);
  else if (route[0] === "activity") renderActivity();
}

// ---- data -------------------------------------------------------------------
let seen = null, fresh = new Set();
async function j(url) { const r = await fetch(url, { cache: "no-store" }); if (!r.ok) throw new Error(r.status); return r.json(); }
async function tick() {
  try {
    const [s, a] = await Promise.all([j("/state"), j("/approval/state")]);
    for (const p of a.pending) p.principal_id = (p.canonical.match(/^principal:(.*)$/m) || [])[1];
    S = s; A = a;
    fresh = new Set(seen ? s.receipts.filter((r) => !seen.has(r.id)).map((r) => r.id) : []);
    seen = new Set(s.receipts.map((r) => r.id));
    $("#live").textContent = "live"; $("#live").classList.remove("off");
    render();
  } catch (e) { $("#live").textContent = "no connection"; $("#live").classList.add("off"); }
}
go(); tick(); setInterval(tick, 1500);
</script>
</body>
</html>
